name: jobradar
version: "1.0.0"
config-version: 2

profile: jobradar

model-paths: ["dbt/models"]
seed-paths:    ["dbt/seeds"]
test-paths:    ["dbt/tests"]
analysis-paths: ["dbt/analyses"]
macro-paths:   ["dbt/macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  jobradar:
    staging:
      +schema: ~
      +materialized: view
    intermediate:
      +schema: ~
      +materialized: view
    marts:
      +schema: ~
      +materialized: table